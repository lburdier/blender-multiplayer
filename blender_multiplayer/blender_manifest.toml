schema_version = "1.0.0"

id = "blender_multiplayer"
version = "1.7.1"
name = "Blender Multiplayer"
tagline = "Edition collaborative en temps reel de la meme scene a plusieurs"
maintainer = "Maxence Marrot"
website = "https://github.com/lburdier/blender-multiplayer"
type = "add-on"

tags = ["System", "Scene", "Object"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Synchronisation entre joueurs (TCP, bore.pub, tunnel HTTPS)"
files = "Sauvegardes, historique et programme cloudflared (hote)"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip"]
